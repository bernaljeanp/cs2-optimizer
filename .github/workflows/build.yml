name: build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python cs2_optimizer.py --test
      - run: pip install pyinstaller==6.11.1
      - run: pyinstaller --onefile --windowed --name CS2Optimizer gui.py
      - uses: actions/upload-artifact@v4
        with:
          name: CS2Optimizer
          path: dist/CS2Optimizer.exe
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release create ${{ github.ref_name }} dist/CS2Optimizer.exe --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
